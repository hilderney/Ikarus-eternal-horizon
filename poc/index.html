<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ikarus: Eternal Horizon — POC</title>
  </head>
  <body>
    <aside class="stage-sidebar left" id="legend">
      <div class="legend-group">
        <div class="legend-title">SHIP (NAV)</div>
        <div class="legend-row"><span>W / S</span><span>move Z</span></div>
        <div class="legend-row"><span>A / D</span><span>move X</span></div>
      </div>
      <div class="legend-group">
        <div class="legend-title">CAMERA MOVE</div>
        <div class="legend-row"><span>I / K</span><span>Z</span></div>
        <div class="legend-row"><span>J / L</span><span>X</span></div>
        <div class="legend-row"><span>R / F</span><span>Y</span></div>
      </div>
      <div class="legend-group">
        <div class="legend-title">CAMERA ROT (NUMPAD)</div>
        <div class="legend-row"><span>8 / 2</span><span>pitch</span></div>
        <div class="legend-row"><span>7 / 9</span><span>roll</span></div>
        <div class="legend-row"><span>4 / 6</span><span>yaw</span></div>
      </div>
    </aside>
    <div id="app"></div>
    <aside class="stage-sidebar right" id="panel"></aside>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
